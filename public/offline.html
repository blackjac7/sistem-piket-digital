<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123a5a">
    <title>Koneksi terputus | Piket YAKIN</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f4f6f9; color: #172033; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); display: grid; place-items: center; }
      main { width: min(100%, 430px); padding: 30px 24px; border: 1px solid #dce2ea; border-radius: 14px; text-align: center; background: #fff; box-shadow: 0 16px 50px rgba(18, 43, 71, .08); }
      img { width: 74px; height: 74px; object-fit: contain; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 23px; line-height: 1.2; }
      p { margin: 0; color: #687386; font-size: 14px; line-height: 1.65; }
      button { min-height: 46px; margin-top: 24px; padding: 10px 18px; border: 0; border-radius: 8px; color: #fff; background: #176b87; font: 700 14px Arial, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="">
      <h1>Koneksi sedang terputus</h1>
      <p>Halaman dan data baru membutuhkan koneksi internet. Setelah jaringan kembali, coba muat ulang halaman ini.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
